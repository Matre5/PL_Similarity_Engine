<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Circle background -->
  <circle cx="100" cy="100" r="100" fill="#2C3E50"/>
  
  <!-- Player silhouette -->
  <g transform="translate(100, 100)">
    <!-- Head (ball) -->
    <circle cx="0" cy="-40" r="20" fill="#ECF0F1"/>
    
    <!-- Body -->
    <rect x="-15" y="-15" width="30" height="50" rx="5" fill="#ECF0F1"/>
    
    <!-- Arms -->
    <rect x="-40" y="-10" width="25" height="10" rx="5" fill="#ECF0F1" transform="rotate(-20 -27.5 -5)"/>
    <rect x="15" y="-10" width="25" height="10" rx="5" fill="#ECF0F1" transform="rotate(20 27.5 -5)"/>
    
    <!-- Legs -->
    <rect x="-20" y="30" width="15" height="40" rx="5" fill="#ECF0F1"/>
    <rect x="5" y="30" width="15" height="40" rx="5" fill="#ECF0F1"/>
    
    <!-- Football at feet -->
    <circle cx="0" cy="75" r="8" fill="#E74C3C"/>
    <circle cx="0" cy="75" r="8" fill="none" stroke="#ECF0F1" stroke-width="1"/>
  </g>
  
  <!-- Jersey number placeholder -->
  <text x="100" y="110" text-anchor="middle" font-size="24" fill="#2C3E50" font-weight="bold">?</text>
</svg>